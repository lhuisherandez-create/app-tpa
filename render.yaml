services:
  - type: web
    name: app-tpa
    runtime: python
    plan: free
    buildCommand: python render_setup.py && pip install -r mapa-tpa-main/requirements.txt
    startCommand: cd mapa-tpa-main && gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
