name: Validate Render build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recreate the exact Render build
        run: python render_setup.py
      - name: Validate mobile JavaScript syntax
        run: node --check mapa-tpa-main/static/t05-mobile.js
      - name: Install application dependencies
        run: python -m pip install -r mapa-tpa-main/requirements.txt
      - name: Compile Python application
        run: python -m compileall -q mapa-tpa-main
