name: Validate Render build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recreate the exact Render build
        run: python render_setup.py
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r mapa-tpa-main/requirements.txt pytest
      - name: Compile application
        run: python -m compileall -q mapa-tpa-main
      - name: Run project tests
        run: python -m pytest -q mapa-tpa-main/tests
